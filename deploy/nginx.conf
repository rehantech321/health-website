# Nginx site for Eldava Health. Installed by setup-server.sh to
# /etc/nginx/conf.d/eldava.conf with __DOMAIN__ substituted. Certbot rewrites
# this file to add the HTTPS server block and the redirect when you run it.

# Rate-limit the sign-in endpoints: a brute-force guard the app itself does
# not yet have. 10 requests/minute per IP, small burst.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream eldava_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  # Stripe posts webhooks here; body must reach the app untouched.
  client_max_body_size 2m;

  # Static assets from the Next build are immutable and hashed.
  location /_next/static/ {
    proxy_pass http://eldava_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~ ^/api/(auth/login|clinician/login|auth/register|applications)$ {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://eldava_app;
    include /etc/nginx/conf.d/eldava-proxy-headers.inc;
  }

  location / {
    proxy_pass http://eldava_app;
    include /etc/nginx/conf.d/eldava-proxy-headers.inc;
  }
}
